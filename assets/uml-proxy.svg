<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="hollowTriangle" markerWidth="18" markerHeight="16" refX="17" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L17,8 L2,14 Z" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    </marker>
    <marker id="openArrow" markerWidth="18" markerHeight="16" refX="17" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L17,8 L2,14" fill="none" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Proxy Pattern - UML class diagram</text>

  <!-- Client -->
  <rect x="40" y="70" width="170" height="64" rx="4" fill="#f7fafc" stroke="#444"/>
  <rect x="40" y="70" width="170" height="30" rx="4" fill="#e2e8f0" stroke="#444"/>
  <text x="125" y="91" text-anchor="middle" font-size="15" font-weight="bold">Client</text>
  <text x="125" y="119" text-anchor="middle" font-size="12" font-family="monospace">only knows the</text>
  <text x="125" y="131" text-anchor="middle" font-size="12" font-family="monospace">interface</text>

  <!-- Interface -->
  <rect x="370" y="60" width="300" height="104" rx="4" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <rect x="370" y="60" width="300" height="52" rx="4" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="520" y="82" text-anchor="middle" font-size="13" font-style="italic">&#171;interface&#187;</text>
  <text x="520" y="102" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic">ImageService</text>
  <line x1="370" y1="112" x2="670" y2="112" stroke="#2b6cb0"/>
  <text x="384" y="136" font-size="13" font-family="monospace">+ fetch(name: string): string</text>

  <!-- RealSubject -->
  <rect x="80" y="350" width="330" height="140" rx="4" fill="#f7fafc" stroke="#444"/>
  <rect x="80" y="350" width="330" height="52" rx="4" fill="#e2e8f0" stroke="#444"/>
  <text x="245" y="373" text-anchor="middle" font-size="15" font-weight="bold">RemoteImageService</text>
  <text x="245" y="392" text-anchor="middle" font-size="12" font-style="italic">(real subject)</text>
  <line x1="80" y1="402" x2="410" y2="402" stroke="#444"/>
  <text x="94" y="426" font-size="13" font-family="monospace">- latencyMs: number = 400</text>
  <text x="94" y="452" font-size="13" font-family="monospace">+ fetch(name: string): string</text>
  <text x="94" y="476" font-size="11" fill="#666" font-style="italic">expensive: network call on every request</text>

  <!-- Proxy -->
  <rect x="560" y="330" width="350" height="170" rx="4" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
  <rect x="560" y="330" width="350" height="52" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.6"/>
  <text x="735" y="353" text-anchor="middle" font-size="15" font-weight="bold">CachingImageProxy</text>
  <text x="735" y="372" text-anchor="middle" font-size="12" font-style="italic">(proxy - same interface!)</text>
  <line x1="560" y1="382" x2="910" y2="382" stroke="#c53030"/>
  <text x="574" y="406" font-size="13" font-family="monospace">- cache: Map&lt;string, string&gt;</text>
  <text x="574" y="430" font-size="13" font-family="monospace">- real: ImageService | null</text>
  <text x="574" y="456" font-size="13" font-family="monospace">+ fetch(name: string): string</text>
  <text x="574" y="482" font-size="11" fill="#666" font-style="italic">checks cache first, creates real service lazily</text>

  <!-- Realization: RealSubject ..|> Interface -->
  <line x1="280" y1="350" x2="452" y2="168" stroke="#333" stroke-dasharray="7 5" marker-end="url(#hollowTriangle)"/>

  <!-- Realization: Proxy ..|> Interface -->
  <line x1="720" y1="330" x2="600" y2="168" stroke="#333" stroke-dasharray="7 5" marker-end="url(#hollowTriangle)"/>

  <!-- Association: Proxy -> RealSubject -->
  <line x1="560" y1="430" x2="410" y2="430" stroke="#333" marker-end="url(#openArrow)"/>
  <text x="485" y="420" text-anchor="middle" font-size="12" fill="#333" font-style="italic">creates lazily,</text>
  <text x="485" y="446" text-anchor="middle" font-size="12" fill="#333" font-style="italic">delegates</text>

  <!-- Dependency: Client ..> Interface -->
  <line x1="210" y1="110" x2="366" y2="110" stroke="#555" stroke-dasharray="5 4" marker-end="url(#openArrow)"/>
  <text x="288" y="102" text-anchor="middle" font-size="12" fill="#555" font-style="italic">&#171;uses&#187;</text>

  <!-- Legend -->
  <text x="40" y="540" font-size="12" fill="#777">dashed + hollow triangle = implements &#160;&#160;&#160;&#160; solid arrow = holds a reference &#160;&#160;&#160;&#160; dashed arrow = dependency</text>
</svg>
